name: Deploy backend to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: backend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Connect to AWS
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Deploy through Systems Manager
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail

          command="sudo -u ubuntu bash -lc 'set -e; cd /home/ubuntu/deploy-backend; git pull --ff-only origin main; sudo docker compose up -d --build backend; curl --retry 10 --retry-delay 2 --retry-connrefused -fsS http://127.0.0.1:8000/health'"
          jq -n --arg command "$command" '{commands: [$command]}' > parameters.json

          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters file://parameters.json \
            --timeout-seconds 1800 \
            --query 'Command.CommandId' \
            --output text)

          for attempt in {1..90}; do
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)

            case "$status" in
              Success)
                echo "배포 완료"
                exit 0
                ;;
              Failed|TimedOut|Cancelled|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "$command_id" \
                  --instance-id "$INSTANCE_ID" \
                  --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "배포 결과 대기 시간 초과"
          exit 1
